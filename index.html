<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Đấu Trí X–O">
  <meta name="description" content="Trò chơi cờ X–O kết hợp trả lời câu hỏi cho 2 đội.">
  <title>Đấu Trí X – O</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="team-chip x">
      <span class="mark">X</span>
      <span class="team-name" data-team-name="X">Đội X</span>
      <span class="wins" title="Số ván thắng"><span data-wins="X">0</span><span class="wins-label"> ván</span></span>
    </div>
    <h1 class="title">Đấu Trí X – O</h1>
    <div class="team-chip o">
      <span class="wins" title="Số ván thắng"><span data-wins="O">0</span><span class="wins-label"> ván</span></span>
      <span class="team-name" data-team-name="O">Đội O</span>
      <span class="mark">O</span>
    </div>
    <button id="btn-sound" class="icon-btn" title="Bật/tắt âm thanh">🔊</button>
  </header>

  <main>
    <!-- 1. Màn hình đặt tên đội -->
    <section id="screen-setup" class="screen active">
      <div class="card setup-card">
        <h2>Chuẩn bị trận đấu</h2>
        <p class="muted">Đặt tên cho hai đội, sau đó hai đội sẽ chạy đua để giành quyền trả lời trước.</p>
        <div class="setup-grid">
          <label class="setup-team x">
            <span class="mark big">X</span>
            <input id="name-X" type="text" value="Đội X" maxlength="24">
          </label>
          <label class="setup-team o">
            <span class="mark big">O</span>
            <input id="name-O" type="text" value="Đội O" maxlength="24">
          </label>
        </div>
        <p id="question-info" class="muted small"></p>
        <button id="btn-to-race" class="btn primary big">Bắt đầu ▶</button>
      </div>
    </section>

    <!-- 2. Màn hình chạy đua -->
    <section id="screen-race" class="screen">
      <div class="card race-card">
        <h2>Cuộc đua giành quyền trả lời trước!</h2>
        <div class="track" id="track">
          <div class="scenery" aria-hidden="true">
            <div class="sun"></div>
            <div class="layer clouds"></div>
            <div class="layer hills"></div>
            <div class="layer trees"></div>
          </div>
          <div class="lane x">
            <div class="lane-label" data-team-name="X">Đội X</div>
            <div class="racer x" id="racer-X"><span>X</span></div>
          </div>
          <div class="lane o">
            <div class="lane-label" data-team-name="O">Đội O</div>
            <div class="racer o" id="racer-O"><span>O</span></div>
          </div>
          <div class="layer flowers" aria-hidden="true"></div>
          <div class="finish-line"></div>
          <div class="race-countdown" id="race-countdown"></div>
        </div>
        <div class="race-result" id="race-result"></div>
        <div class="race-actions">
          <button id="btn-race" class="btn primary big">Xuất phát! 🏁</button>
          <button id="btn-to-game" class="btn success big hidden">Vào trò chơi ▶</button>
        </div>
      </div>
    </section>

    <!-- 3. Màn hình chơi chính -->
    <section id="screen-game" class="screen">
      <div class="game-layout">
        <div class="card board-card">
          <div class="board" id="board">
            <button class="cell" data-i="0"></button>
            <button class="cell" data-i="1"></button>
            <button class="cell" data-i="2"></button>
            <button class="cell" data-i="3"></button>
            <button class="cell" data-i="4"></button>
            <button class="cell" data-i="5"></button>
            <button class="cell" data-i="6"></button>
            <button class="cell" data-i="7"></button>
            <button class="cell" data-i="8"></button>
          </div>
          <p class="board-hint" id="board-hint"></p>
        </div>

        <div class="card question-card">
          <div class="turn-banner" id="turn-banner"></div>

          <!-- Chờ đội chọn ô trên bàn cờ -->
          <div class="phase" id="phase-ready">
            <p class="big-msg" id="ready-msg"></p>
            <p class="muted ready-sub" id="ready-sub"></p>
          </div>

          <!-- Đang trả lời -->
          <div class="phase" id="phase-asking">
            <div class="q-meta">
              <span id="q-number"></span>
              <span class="timer-text" id="timer-text"></span>
            </div>
            <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
            <div class="q-text" id="q-text"></div>
            <img class="q-image hidden" id="q-image" alt="">
            <ol class="q-options" id="q-options" type="A"></ol>
            <p class="auto-hint hidden" id="auto-hint">👆 Bấm vào đáp án để trả lời – máy sẽ tự chấm</p>
            <div class="q-answer hidden" id="q-answer"></div>
            <div class="judge">
              <button id="btn-correct" class="btn success big">✓ Đúng</button>
              <button id="btn-wrong" class="btn danger big">✗ Sai</button>
            </div>
            <div class="judge-extra">
              <button id="btn-reveal" class="btn ghost">Hiện đáp án</button>
              <button id="btn-pause" class="btn ghost">⏸ Tạm dừng</button>
              <button id="btn-skip" class="btn ghost">Bỏ qua câu này</button>
            </div>
          </div>

          <!-- Kết quả câu trả lời -->
          <div class="phase" id="phase-result">
            <p class="big-msg" id="result-msg"></p>
            <div class="q-answer" id="result-answer"></div>
            <p class="muted ready-sub" id="result-sub"></p>
            <button id="btn-next-turn" class="btn primary big">Tiếp tục ▶</button>
            <button id="btn-bonus" class="btn bonus hidden">⭐ Mở câu hỏi còn lại</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Thông báo thắng / hòa -->
  <div class="overlay hidden" id="overlay">
    <div class="overlay-card">
      <div class="overlay-mark" id="overlay-mark"></div>
      <h2 id="overlay-title"></h2>
      <p id="overlay-sub" class="muted"></p>
      <div class="overlay-actions">
        <button id="btn-open-bonus" class="btn bonus big hidden">⭐ Mở câu hỏi còn lại</button>
        <button id="btn-new-round" class="btn primary big">Ván mới (đua lại) 🏁</button>
        <button id="btn-close-overlay" class="btn ghost">Xem lại bàn cờ</button>
      </div>
    </div>
  </div>

  <div id="confetti" class="confetti"></div>

  <script src="questions.js"></script>
  <script src="game.js"></script>
</body>
</html>
